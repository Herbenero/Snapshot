<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Domino Darts</title>
  <style>
    :root {
      --bg-color: #1a1a24;
      --card-bg: #262636;
      --accent: #ff4757;
      --accent-hover: #ff6b81;
      --green: #2ed573;
      --text: #ffffff;
      --text-dim: #a4b0be;
      --border-radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 2.5rem;
      color: var(--accent);
      margin-bottom: 5px;
    }

    header p {
      color: var(--text-dim);
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    /* Setup Screen */
    .setup-card {
      background-color: var(--card-bg);
      padding: 25px;
      border-radius: var(--border-radius);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #3d3d5c;
      background: #1a1a24;
      color: #fff;
      font-size: 1rem;
    }

    button {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      transition: background 0.2s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background-color: #3d3d5c !important;
    }

    .player-list {
      list-style: none;
      margin-bottom: 20px;
    }

    .player-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a1a24;
      padding: 10px 15px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .remove-btn {
      background: #ff4757;
      padding: 4px 10px;
      font-size: 0.8rem;
    }

    .options-group {
      border-top: 1px solid #3d3d5c;
      padding-top: 15px;
      margin-bottom: 20px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    /* Game Screen */
    .game-screen {
      display: none;
      flex-direction: column;
      gap: 20px;
    }

    .turn-bar {
      background: var(--card-bg);
      padding: 15px 20px;
      border-radius: var(--border-radius);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .active-player {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent);
    }

    .dart-tracker {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .dart-pip {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #3d3d5c;
    }

    .dart-pip.active {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }

    .board-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .board-grid {
        grid-template-columns: 1fr;
      }
    }

    .main-panel, .side-panel {
      background: var(--card-bg);
      padding: 20px;
      border-radius: var(--border-radius);
    }

    /* Target Domino */
    .target-container {
      text-align: center;
      margin-bottom: 20px;
    }

    .domino-large {
      display: inline-flex;
      background: #fff;
      color: #000;
      border-radius: 8px;
      padding: 15px;
      font-size: 2.5rem;
      font-weight: bold;
      box-shadow: 0 6px 12px rgba(0,0,0,0.4);
      margin-top: 10px;
    }

    .domino-half {
      padding: 0 15px;
      border-right: 3px solid #000;
    }

    .domino-half:last-child {
      border-right: none;
    }

    .domino-half.hit {
      background-color: var(--green);
      color: #fff;
      border-radius: 4px;
    }

    /* Numpad Input */
    .numpad {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 15px;
    }

    .numpad button {
      background: #1a1a24;
      padding: 15px 5px;
      font-size: 1.1rem;
      border: 1px solid #3d3d5c;
    }

    .numpad button:hover {
      background: #3d3d5c;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .action-buttons button {
      flex: 1;
    }

    /* Player Chain */
    .domino-chain {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .domino-mini {
      display: inline-flex;
      background: #fff;
      color: #000;
      font-size: 0.85rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .domino-mini span {
      padding: 0 3px;
    }

    .domino-mini span:first-child {
      border-right: 1px solid #000;
    }

    .wild-btn {
      background: #eccc68;
      color: #000;
      margin-top: 10px;
      width: 100%;
    }

    .wild-btn:hover {
      background: #ffa502;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎯 Domino Darts</h1>
    <p>Connect your dominoes to win!</p>
  </header>

  <div class="container">
    <!-- SETUP SCREEN -->
    <div id="setup-screen" class="setup-card">
      <h2>Game Setup</h2>
      <br>
      <div class="input-group">
        <input type="text" id="player-name-input" placeholder="Enter player name" />
        <button id="add-player-btn">Add Player</button>
      </div>

      <ul id="player-list" class="player-list"></ul>

      <div class="options-group">
        <h3>Optional Rules</h3>
        <br>
        <label class="checkbox-label">
          <input type="checkbox" id="rule-chain" checked />
          Chain Reaction (Remaining darts carry over if next domino matches)
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="rule-doubles" checked />
          Doubles Bonus (Single double-hit finishes a double domino)
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="rule-wild" checked />
          Wild Domino (1 wildcard per player)
        </label>
      </div>

      <button id="start-game-btn" style="width: 100%;">Start Game</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="game-screen">
      <div class="turn-bar">
        <div>
          <span style="color: var(--text-dim);">Current Turn:</span>
          <div id="active-player-name" class="active-player">Player 1</div>
        </div>
        <div>
          <span style="color: var(--text-dim); display: block; margin-bottom: 5px; text-align: right;">Darts Left</span>
          <div class="dart-tracker">
            <div class="dart-pip active" id="dart-1"></div>
            <div class="dart-pip active" id="dart-2"></div>
            <div class="dart-pip active" id="dart-3"></div>
          </div>
        </div>
      </div>

      <div class="board-grid">
        <!-- Input & Current Target -->
        <div class="main-panel">
          <div class="target-container">
            <p style="color: var(--text-dim);">Target Domino (<span id="domino-progress">1</span>/7)</p>
            <div id="target-domino" class="domino-large">
              <div id="target-side-1" class="domino-half">?</div>
              <div id="target-side-2" class="domino-half">?</div>
            </div>
            <div style="margin-top: 10px;">
              <button id="use-wild-btn" class="wild-btn hidden">Use Wildcard Domino</button>
            </div>
          </div>

          <p style="text-align: center; margin-bottom: 10px; color: var(--text-dim);">Enter Dart Hit:</p>
          <div class="numpad" id="numpad">
            <!-- Dynamic Numpad 1-20, Bull, Miss -->
          </div>
          
          <div class="action-buttons">
            <button id="undo-btn" style="background: #eccc68; color: #000;" disabled>↩ Undo</button>
            <button id="miss-btn" style="background: #3d3d5c;">Miss / End Turn</button>
          </div>
        </div>

        <!-- Player Status / Hand -->
        <div class="side-panel">
          <h3>Completed Chain</h3>
          <div id="completed-chain" class="domino-chain">
            <!-- Completed dominoes shown here -->
          </div>

          <h3 style="margin-top: 20px;">Remaining Dominoes</h3>
          <div id="remaining-chain" class="domino-chain">
            <!-- Upcoming dominoes shown here -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- GAME STATE ---
    let players = [];
    let currentPlayerIdx = 0;
    let dartsLeft = 3;
    let rules = { chain: true, doubles: true, wild: true };
    let historyStack = [];

    // --- DOM ELEMENTS ---
    const setupScreen = document.getElementById('setup-screen');
    const gameScreen = document.getElementById('game-screen');
    const playerNameInput = document.getElementById('player-name-input');
    const addPlayerBtn = document.getElementById('add-player-btn');
    const playerList = document.getElementById('player-list');
    const startGameBtn = document.getElementById('start-game-btn');

    const activePlayerName = document.getElementById('active-player-name');
    const dominoProgress = document.getElementById('domino-progress');
    const targetSide1 = document.getElementById('target-side-1');
    const targetSide2 = document.getElementById('target-side-2');
    const completedChain = document.getElementById('completed-chain');
    const remainingChain = document.getElementById('remaining-chain');
    const numpad = document.getElementById('numpad');
    const missBtn = document.getElementById('miss-btn');
    const undoBtn = document.getElementById('undo-btn');
    const useWildBtn = document.getElementById('use-wild-btn');

    // --- SETUP FUNCTIONS ---
    addPlayerBtn.addEventListener('click', () => {
      const name = playerNameInput.value.trim();
      if (name) {
        players.push(name);
        playerNameInput.value = '';
        renderPlayerList();
      }
    });

    function renderPlayerList() {
      playerList.innerHTML = '';
      players.forEach((p, index) => {
        const li = document.createElement('li');
        li.className = 'player-item';
        li.innerHTML = `
          <span>${p}</span>
          <button class="remove-btn" onclick="removePlayer(${index})">X</button>
        `;
        playerList.appendChild(li);
      });
    }

    function removePlayer(idx) {
      players.splice(idx, 1);
      renderPlayerList();
    }

    function generateDominoHand() {
      const hand = [];
      let lastNum = Math.floor(Math.random() * 20) + 1;

      for (let i = 0; i < 7; i++) {
        let nextNum;
        if (Math.random() < 0.2) {
          nextNum = lastNum;
        } else {
          const numbers = [...Array(20).keys()].map(x => (x + 1).toString());
          numbers.push('Bull');
          nextNum = numbers[Math.floor(Math.random() * numbers.length)];
        }
        hand.push({
          val1: String(lastNum),
          val2: String(nextNum),
          hit1: false,
          hit2: false
        });
        lastNum = nextNum;
      }
      return hand;
    }

    startGameBtn.addEventListener('click', () => {
      if (players.length === 0) {
        alert('Please add at least one player!');
        return;
      }

      rules.chain = document.getElementById('rule-chain').checked;
      rules.doubles = document.getElementById('rule-doubles').checked;
      rules.wild = document.getElementById('rule-wild').checked;

      players = players.map(name => ({
        name: name,
        hand: generateDominoHand(),
        currentIndex: 0,
        hasWild: rules.wild
      }));

      setupScreen.classList.add('hidden');
      gameScreen.style.display = 'flex';

      buildNumpad();
      startTurn();
    });

    // --- NUMPAD GENERATION ---
    function buildNumpad() {
      numpad.innerHTML = '';
      for (let i = 1; i <= 20; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        btn.onclick = () => handleHit(String(i));
        numpad.appendChild(btn);
      }
      const bullBtn = document.createElement('button');
      bullBtn.textContent = 'Bull';
      bullBtn.style.gridColumn = 'span 2';
      bullBtn.style.background = '#ff4757';
      bullBtn.onclick = () => handleHit('Bull');
      numpad.appendChild(bullBtn);
    }

    // --- HISTORY / UNDO SYSTEM ---
    function saveState() {
      const snapshot = {
        players: JSON.parse(JSON.stringify(players)),
        currentPlayerIdx: currentPlayerIdx,
        dartsLeft: dartsLeft
      };
      historyStack.push(snapshot);
      undoBtn.disabled = false;
    }

    undoBtn.addEventListener('click', () => {
      if (historyStack.length === 0) return;

      const previousState = historyStack.pop();
      players = previousState.players;
      currentPlayerIdx = previousState.currentPlayerIdx;
      dartsLeft = previousState.dartsLeft;

      if (historyStack.length === 0) {
        undoBtn.disabled = true;
      }

      updateDartPips();
      renderBoard();
    });

    // --- GAMEPLAY LOGIC ---
    function startTurn() {
      dartsLeft = 3;
      historyStack = [];
      undoBtn.disabled = true;
      updateDartPips();
      renderBoard();
    }

    function updateDartPips() {
      for (let i = 1; i <= 3; i++) {
        const pip = document.getElementById(`dart-${i}`);
        if (i <= dartsLeft) {
          pip.classList.add('active');
        } else {
          pip.classList.remove('active');
        }
      }
    }

    function renderBoard() {
      const p = players[currentPlayerIdx];
      activePlayerName.textContent = p.name;
      dominoProgress.textContent = Math.min(p.currentIndex + 1, 7);

      const currentDomino = p.hand[p.currentIndex] || p.hand[p.hand.length - 1];

      // Render Active Target Domino
      targetSide1.textContent = currentDomino.val1;
      targetSide2.textContent = currentDomino.val2;

      if (currentDomino.hit1) targetSide1.classList.add('hit');
      else targetSide1.classList.remove('hit');

      if (currentDomino.hit2) targetSide2.classList.add('hit');
      else targetSide2.classList.remove('hit');

      // Wildcard button state
      if (p.hasWild && p.currentIndex < 7) {
        useWildBtn.classList.remove('hidden');
      } else {
        useWildBtn.classList.add('hidden');
      }

      // Render Completed Chain
      completedChain.innerHTML = '';
      for (let i = 0; i < p.currentIndex; i++) {
        const d = p.hand[i];
        completedChain.appendChild(createMiniDomino(d.val1, d.val2));
      }

      // Render Remaining Chain
      remainingChain.innerHTML = '';
      for (let i = p.currentIndex + 1; i < p.hand.length; i++) {
        const d = p.hand[i];
        remainingChain.appendChild(createMiniDomino(d.val1, d.val2));
      }
    }

    function createMiniDomino(v1, v2) {
      const el = document.createElement('div');
      el.className = 'domino-mini';
      el.innerHTML = `<span>${v1}</span><span>${v2}</span>`;
      return el;
    }

    function handleHit(value) {
      if (dartsLeft <= 0) return;

      saveState();

      const p = players[currentPlayerIdx];
      const target = p.hand[p.currentIndex];

      // Handle Double Bonus rule
      if (rules.doubles && target.val1 === target.val2 && value === target.val1) {
        target.hit1 = true;
        target.hit2 = true;
      } else {
        // Normal hit detection
        if (value === target.val1 && !target.hit1) {
          target.hit1 = true;
        } else if (value === target.val2 && !target.hit2) {
          target.hit2 = true;
        }
      }

      dartsLeft--;
      updateDartPips();

      // Check if current domino completed
      if (target.hit1 && target.hit2) {
        p.currentIndex++;

        // WIN CONDITION
        if (p.currentIndex >= 7) {
          renderBoard();
          setTimeout(() => alert(`🎉 ${p.name} wins the game!`), 10);
          return;
        }

        // Check Chain Reaction Rule
        if (!rules.chain) {
          endTurn();
          return;
        }
      }

      if (dartsLeft === 0) {
        endTurn();
      } else {
        renderBoard();
      }
    }

    useWildBtn.addEventListener('click', () => {
      saveState();

      const p = players[currentPlayerIdx];
      if (!p.hasWild) return;

      p.hasWild = false;
      const target = p.hand[p.currentIndex];
      target.hit1 = true;
      target.hit2 = true;
      p.currentIndex++;

      if (p.currentIndex >= 7) {
        renderBoard();
        setTimeout(() => alert(`🎉 ${p.name} wins the game!`), 10);
        return;
      }

      renderBoard();
    });

    missBtn.addEventListener('click', () => {
      endTurn();
    });

    function endTurn() {
      // Reset uncompleted progress for current domino
      const p = players[currentPlayerIdx];
      if (p.currentIndex < 7) {
        p.hand[p.currentIndex].hit1 = false;
        p.hand[p.currentIndex].hit2 = false;
      }

      // Next Player
      currentPlayerIdx = (currentPlayerIdx + 1) % players.length;
      startTurn();
    }
  </script>
</body>
</html>
